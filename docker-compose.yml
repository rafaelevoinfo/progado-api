version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: progado_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: progado
      MYSQL_USER: ${MYSQL_USER_PROGADO}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD_PROGADO}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - progado_db_data:/var/lib/mysql
    networks:
      - progado_network

  app:
    build:
      context: .            
      dockerfile: Dockerfile
    image: progado_app:latest
    container_name: progado_app
    restart: always
    volumes:
      - progado_app_data:/var/www/html/Atualizacoes         
    environment:
      MYSQL_USER_PROGADO: ${MYSQL_USER_PROGADO}
      MYSQL_PASSWORD_PROGADO: ${MYSQL_PASSWORD_PROGADO}
    depends_on:
      - db
    networks:
      - progado_network
      - dokploy-network    

volumes:
  progado_db_data:
  progado_app_data:

networks:
  progado_network:
    driver: bridge
  dokploy-network:
    external: true
